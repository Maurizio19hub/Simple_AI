<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riconoscimento Cifre</title>
</head>
<body>
    <h1>Disegna una cifra</h1>
    <canvas id="canvas" style="width:280px; height:280px; border:1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="clearCanvas()">Cancella</button>
    <button onclick="sendToBackend()">Invia</button>
    
    <div id="result"></div>

    <script>    
        (() => {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Ridimensiona il canvas per adattarsi al CSS size e al devicePixelRatio
        function fitToContainer() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            // Mantieni le dimensioni CSS
            canvas.style.width = rect.width + "px";
            canvas.style.height = rect.height + "px";
            // Reset + scala il contesto in modo che le coordinate rimangano in CSSpx
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        fitToContainer();
        window.addEventListener("resize", fitToContainer);

        // Evita che il browser interpreti il touch come scrolling/zoom
        canvas.style.touchAction = "none";

        // Stile penna
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            // e.clientX / clientY sono disponibili per PointerEvent
            return [e.clientX - rect.left, e.clientY - rect.top];
        }

        canvas.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            canvas.setPointerCapture(e.pointerId);
            isDrawing = true;
            [lastX, lastY] = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            console.log("start", lastX, lastY);
        });

        canvas.addEventListener("pointermove", (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const [x, y] = getPos(e);
            ctx.lineTo(x, y);
            ctx.stroke();
            // evita collegamenti strani su alcuni browser: riapri il path e posizionati
            ctx.beginPath();
            ctx.moveTo(x, y);
            lastX = x; lastY = y;
            //console.log("draw", x, y);
        });

        function stop(e) {
            // e potrebbe non avere pointerId in certe chiamate (es. chiamato manualmente)
            try { if (e && e.pointerId) canvas.releasePointerCapture(e.pointerId); } catch (_) {}
            isDrawing = false;
            ctx.beginPath(); // reset del path per sicurezza
            console.log("stop");
        }

        canvas.addEventListener("pointerup", stop);
        canvas.addEventListener("pointercancel", stop);
        canvas.addEventListener("pointerout", stop);

        // funzione utile per resettare la tela
        window.clearCanvas = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };
        })();
</script>
<script>
    function sendToBackend() {
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append("file", blob, "digit.png");

            await fetch("http://localhost:3000/upload", {
            method: "POST",
            body: formData
            });
        }, "image/png");
    }

</script>
</body>
</html>
